[project]
name = "financial-risk-platform"
version = "0.1.0"
description = "Financial Risk Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pandas>=2.0.3",
    "numpy>=1.26.0",
    "sqlalchemy>=2.0.29",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
    "yfinance>=0.2.38",
    "scikit-learn>=1.3.2",
    "vaderSentiment>=3.3.2",
    "feedparser>=6.0.11",
    "scipy>=1.11.4",
    "requests>=2.31.0",
    "plotly>=5.18.0",
    "streamlit>=1.32.0",
]

[tool.vercel]
entrypoint = "app.api.main:app"
